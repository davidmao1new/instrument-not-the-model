# Quantization robustness set. Same checkpoints at Q8_0, held for the
# robustness re-run in PROTOCOL section 7. NOT part of the primary panel:
# mixing quantization levels within a contrast would confound generation with
# numerical precision.
robustness_quantization:
  - {id: mistral-7b-instruct-v0.1, file: models/mistral-7b-instruct-v0.1.Q8_0.gguf, sha256: ab634d1d552dc60533e486cbcc73ad9b01358994dabf2453230e7fcd77308dc8}
  - {id: llama-2-7b-chat,          file: models/llama-2-7b-chat.Q8_0.gguf,          sha256: f47dade5e86466edb66c5afe6f8e9fb1fbb2c292827b90bd46b7a1817d864bf2}

excluded_models:
  - id: llama-2-70b-chat
    reason: >
      Unrunnable on this hardware (38.58 GiB at Q4_K_M against 15.8 GB RAM) and
      unreachable by API: OpenRouter's catalogue contains zero Llama 2 models.
      PROTOCOL section 5 names it. Exclusion is RECOMMENDED, NOT APPLIED.
    pending_approval: true
    document: docs/decision_llama2_70b.md

# ---------------------------------------------------------------------------
# Inference. Held identical across every model so the model is the only thing
# that varies.
# ---------------------------------------------------------------------------
inference:
  server: llama.cpp llama-server
  build: b10107
  backend: vulkan
  n_gpu_layers: 99
  context: 4096
  threads: 8
  parallel: 4
  temperature: 0.0
  seed: 42
  prompt_order: [system, job_posting, resume]   # posting first so it prefix-caches
  replication:
    temperature: 0.7
    subsample_fraction: 0.10                     # PROTOCOL section 5

# ---------------------------------------------------------------------------
# Outcome measures. PROTOCOL section 4 makes binary advance primary; the Stage 0
# pilot showed that is not viable for pre-2024 open-weight models.
# ---------------------------------------------------------------------------
outcomes:
  binary_advance:
    status: secondary
    max_tokens: 8
    grammar: 'root ::= "yes" | "no"'
    note: >
      Retained so the two instruments can be compared directly, which is itself
      a reportable result. Degenerate on mistral-7b-instruct-v0.1.

  email_generation:
    status: proposed_primary_for_pre_2024
    pending_approval: true
    max_tokens: 220
    n_paraphrased_templates: 5
    classification: rejection markers checked before acceptance markers
    note: >
      Follows An et al. (arXiv:2406.10486), who obtain non-degenerate acceptance
      rates from exactly our pre-2024 anchor set. Roughly 20x the decode cost of
      the binary verdict, so max_tokens should be tuned down once it is known how
      early the accept/reject signal appears. CHANGING THE PRIMARY OUTCOME TOUCHES
      PROTOCOL SECTION 4 AND NEEDS APPROVAL.

  forced_choice:
    status: secondary
    max_tokens: 2
    grammar: 'root ::= "A" | "B"'
    order_reversal: required        # NOT optional. 4 of 5 pairs were order-dependent.
    note: Pairs that disagree under reversal are reported as an order-effect rate.

  score_0_100:
    status: unusable_on_pre_2024
    note: mistral-7b-instruct-v0.1 will not emit a bare number; it writes prose.

# ---------------------------------------------------------------------------
# Sample sizes. PROTOCOL section 6's numbers are superseded by the re-derivation
# in docs/power_analysis.md, which is NOT YET APPROVED.
# ---------------------------------------------------------------------------
sample_size:
  registered:
    main_effect_pairs: 10000
    basis: "PROTOCOL section 6, independent-samples formula"
  proposed:
    pending_approval: true
    main_effect_pairs: 4000
    interaction_pairs_h2b: 8000
    planning_discordance_psi: 0.20
    basis: "docs/power_analysis.md, matched-pairs variance (psi - delta^2)/n"
  stage1_pilot_pairs: 300
  stage1_purpose: >
    Measure psi per model and re-plan Stage 2 from the measured value, which is
    what PROTOCOL section 6's two-stage structure exists for.

# ---------------------------------------------------------------------------
# Analysis. Fixed here BEFORE results are seen.
# ---------------------------------------------------------------------------
analysis:
  primary_estimand: average marginal effect of race signal on advance probability
  units: percentage points
  interval: bootstrap 95% CI, cluster-resampled at the job-posting level
  bootstrap_replicates: 2000
  multiplicity: benjamini_hochberg
  multiplicity_scope: model x group cells
  report_both_raw_and_adjusted: true
  h2b_test: interaction of channel x model_generation
  h2b_note: >
    NOT a comparison of two separate significance tests. CLAUDE.md flags that as
    the most common error in this literature.
  hierarchical_backend: numpyro
  hierarchical_note: >
    Plain logistic regression is not a substitute and must never be labelled
    mixed-effects.
  report_mde_alongside_every_null: true

# ---------------------------------------------------------------------------
# Cost control. The study is designed to cost nothing.
# ---------------------------------------------------------------------------
cost:
  paid_apis_enabled: false
  hard_stop: >
    Any paid API spend requires David's explicit prior approval. Not a threshold,
    a hard stop. Log every actual expenditure in PROGRESS.md.
  local_only: true
