    file: models/llama-2-7b-chat.Q4_K_M.gguf
    sha256: 08a5566d61d7cb6b420c3e4387a39e0078e1f2fe5f055f3a03887385304d4bfa
    bytes: 4081004224
    source_repo: TheBloke/Llama-2-7B-Chat-GGUF
    quantization: Q4_K_M
    params_b: 6.74
    released: "2023-07"
    generation: pre_2024
    role: primary pre-2024 anchor, Llama family
