# Paper A run configuration.
#
# PURPOSE. PROTOCOL.md section 5 requires that every model be pinned to an exact
# snapshot, because "a model name without a snapshot is not reproducible". For
# local GGUF artifacts the strongest available pin is the SHA256 of the file, and
# that is what is recorded here. Every number in the paper traces back to one of
# these hashes.
#
# GENERATION LABELS ARE PRE-SPECIFIED HERE, BEFORE ANALYSIS. RQ1 turns entirely
# on the pre-2024 / post-2024 split, so assigning that label after seeing results
# would be the study's most obvious failure mode. The rule is stated below and
# applied mechanically.
#
# STATUS: proposals in this file that touch a pre-registered section of
# PROTOCOL.md are marked `pending_approval: true` and MUST NOT be acted on until
# David signs off. See PROGRESS.md "Open decisions".

meta:
  protocol_version: "PROTOCOL.md @ 2026-07-26"
  config_version: "0.1.0"
  written: "2026-07-26"
  notes: >
    Written after the Stage 0 pilot and the first five literature reads.
    Nothing here overrides PROTOCOL.md; where the two differ the difference is
    flagged and logged in CHANGELOG.md.

# ---------------------------------------------------------------------------
# Generation label rule. Applied mechanically, no judgement calls.
# ---------------------------------------------------------------------------
generation_rule:
  cutoff: "2024-01-01"
  basis: "public release date of the specific checkpoint, not the family"
  pre_2024: "checkpoint released strictly before the cutoff"
  post_2024: "checkpoint released on or after the cutoff"
  rationale: >
    Gao, Jiang & Yan (arXiv:2606.28978) place the behavioural break between
    their sole 2023 model and everything from 2024 onward. Using the same
    cutoff keeps our RQ1 contrast directly comparable to theirs.

# ---------------------------------------------------------------------------
# Model panel. All local, all free, all captured and hashed.
# ---------------------------------------------------------------------------
models:

  - id: mistral-7b-instruct-v0.1
    file: models/mistral-7b-instruct-v0.1.Q4_K_M.gguf
    sha256: 14466f9d658bf4a79f96c3f3f22759707c291cac4e62fea625e80c7d32169991
    bytes: 4368438944
    source_repo: TheBloke/Mistral-7B-Instruct-v0.1-GGUF
    quantization: Q4_K_M
    params_b: 7.24
    released: "2023-09"
    generation: pre_2024
    role: primary pre-2024 anchor
    quality_gate: FAILED
    quality_gate_note: >
      Stage 0 pilot. Degenerate under a constrained verdict: 100% yes under one
      framing, 100% no under another including for an unqualified candidate,
      10/10 position-A under forced choice. See docs/pilot_findings_stage0.md.
      An et al. (arXiv:2406.10486) obtain ~56.7% acceptance from this same model
      using open-ended email generation, so the failure is instrument-specific
      rather than a property of the model's judgement. Re-gate under the email
      instrument before admitting it to the confirmatory panel.

  - id: mistral-7b-v0.1-base
    file: models/mistral-7b-v0.1.Q4_K_M.gguf
    sha256: ce6253d2e91adea0c35924b38411b0434fa18fcb90c52980ce68187dbcbbe40c
    bytes: 4368438912
    source_repo: TheBloke/Mistral-7B-v0.1-GGUF
